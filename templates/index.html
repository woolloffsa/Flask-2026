<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digicloset</title>
    <link type="text/css" rel="stylesheet" href="/static/css/html.css"
</head>
<body>
    <header>
        <h1>CyberStyle</h1>
    </header>
    <nav>
        <a href="/inventory">Inventory</a>
        <a href="/outfits">Outfits</a>
    </nav>
    <main>
        {% for item in clothes %}
        <article>
            <img src="/static/images/{{ item[5] }}.png" alt={{ item[5] }}>
            <p>Clothing Type: {{ item[2] }}</p>
            <p>Colour: {{ item[3] }}</p>
            <p>Season: {{ item[4] }} weather</p>
        </article>
        {% endfor %}
    </main>
</body>
</html>
