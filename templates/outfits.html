<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/static/css/outfits.css"
</head>
<body>
    <header>
        <h1>Outfits</h1>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/inventory">Inventory</a>
    </nav>
    <main class="ds-container">
        <div class="ds-half">
            <div class="speaker-grille">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>
            <div class="screen-frame">
                <section class="screen">
                    <div class="slide-wrapper">
                        <div class="slider">
                            {% for top in tops %}
                                <img id="top-slide-{{ loop.index }}" src="/static/images/{{ top[1] }}.png" alt={{ top[1] }}>
                            {% endfor %}
                        </div>
                    </div>
                </section>
            </div>
            <div class="speaker-grille">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="hinge">
        </div>
        <div class="ds-half">
            <div class="controls">
                <div class="d-pad">
                    <div class="d-pad-horizontal"></div>
                    <div class="d-pad-vertical"></div>
                </div>
            </div>
            <div class="screen-frame">
                <section class="screen">
                    <div class="slide-wrapper">
                        <div class="slider">
                            {% for bottom in bottoms %}
                                <img id="top-slide-{{ loop.index }}" src="/static/images/{{ bottom[1] }}.png" alt={{ bottom[1] }}>
                            {% endfor %}
                        </div>
                    </div>
                </section>
            </div>
            <div class="controls">
                <div class="abxy-buttons">
                    <span class="btn btn-top"></span>
                    <span class="btn btn-left"></span>
                    <span class="btn btn-right"></span>
                    <span class="btn btn-bottom"></span>
                </div>
                <div class="option-buttons">
                    <span></span><span></span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
