<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/static/css/outfits.css"
</head>
<body>
    <header>
        <h1>Outfits</h1>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/inventory">Inventory</a>
    </nav>
    <main>
        <section class="container">
            <div class="slide-wrapper">
                <div class="slider">
                    {% for top in tops %}
                        <img id="top-slide-{{ loop.index }}" src="/static/images/{{ top[1] }}.png" alt={{ top[1] }}>
                    {% endfor %}
                </div>
                <div class="slider-nav">
                    {% for top in tops %}
                        <a href="#top-slide-{{ loop.index }}"></a>
                    {% endfor %}
                </div>
            </div>
        </section>
        <section class="container">
            <div class="slide-wrapper">
                <div class="slider">
                    {% for bottom in bottoms %}
                        <img id="top-slide-{{ loop.index }}" src="/static/images/{{ bottom[1] }}.png" alt={{ bottom[1] }}>
                    {% endfor %}
                </div>
                <div class="slider-nav">
                    {% for bottom in bottoms %}
                        <a href="#top-slide-{{ loop.index }}"></a>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>
</body>
</html>
