<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digicloset</title>
    <link type="text/css" rel="stylesheet" href="/static/css/inventory.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&display=swap" rel="stylesheet">
<body>
    <header>
        <h1>Inventory</h1>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/outfits">Outfits</a>
        <div class="dropdown">Sort By
            <div class="dropdown-content">
                <a href="/inventory?sort=clothing_colour&order={{ order }}">Colour</a>
                <a href="/inventory?sort=clothing_type&order={{ order }}">Type</a>
                <a href="/inventory?sort=seasonal_type&order={{ order }}">Season</a>
            </div>
        </div>
    </nav>
    <main>
        <form method="POST" action="/search">
            <input type="text" name="search" id="search">
            <input type="submit" value="Search">
        </form>
        {% for item in clothes %}
        <article>
            <div class="image">
                <img src="/static/images/{{ item[3] }}.png" alt={{ item[3] }}>
            </div>
            <p>Clothing type: {{ item[0] }}</p>
            <p>Colour: {{ item[1] }}</p>
            <p>Season: {{ item[2] }} weather</p>
        </article>
        {% endfor %}
    </main>
    <footer>
        <p>Sabine Woolloff</p>
    </footer>
</body>
</html>
